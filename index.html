<body>

<canvas id="cf"></canvas><div class="w">
<div class="hd"><h1>Ct<span class="kn">r<small>Ken</small></span> Catur</h1><button id="sb" aria-label="Suara">🔊</button><button id="gb" aria-label="Pengaturan">⚙︎</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
const G=new Chess(),F="abcdefgh",GL={p:"♟\uFE0E",n:"♞",b:"♝",r:"♜",q:"♛",k:"♚"},V={p:100,n:320,b:330,r:500,q:900,k:0};
let me="w",sel=null,sug=null,last=null,info="",ai=true;
const $=id=>document.getElementById(id),B=$("board"),A=$("arr");
const flip=()=>me==="b";
function sqAt(i){const r=Math.floor(i/8),c=i%8,f=flip()?7-c:c,k=flip()?r:7-r;return{s:F[f]+(k+1),f,k}}
function xy(s){const f=F.indexOf(s[0]),k=+s[1]-1;return[(flip()?7-f:f)+.5,(flip()?k:7-k)+.5]}
function render(){
  const bdg=bdgMap();const mv0=sel?G.moves({square:sel,verbose:true}):[],tg=mv0.filter(m=>!m.captured||m.flags.includes("e")).map(m=>m.to),rk=[],rw=[];
  for(const m of mv0){if(!m.captured)continue;(m.color==="w"?rw:rk).push(m.flags.includes("e")?m.to[0]+m.from[1]:m.to)}
  B.innerHTML="";if(G.in_check()&&!checkers().length)repairG();const kg=G.in_check(),ck=kg?checkers():[];
  for(let i=0;i<64;i++){
    const{s,f,k}=sqAt(i),d=document.createElement("div"),p=G.get(s);
    d.className="q "+((f+k)%2===0?"d":"l")+(s===sel?" sel":"")+(last&&(s===last.from||s===last.to)?" last":"")+(sug&&(s===sug.from||s===sug.to)?" sug":"")+(tg.includes(s)?" dot":"")+(rk.includes(s)?" capk":"")+(rw.includes(s)?" capw":"")+(ck.includes(s)?" atk":"");
    let h="";
    if(p){let st="",cl=p.color==="w"?"pw":"pb";
      if(anim&&(s===anim.to||(anim.rf&&s===anim.rt))){const[ax,ay]=xy(s===anim.to?anim.from:anim.rf),[bx,by]=xy(s);cl+=" mv";st=' style="--dx:'+(ax-bx)+';--dy:'+(ay-by)+'"'}
      h='<span class="p '+cl+'"'+st+'>'+GL[p.type]+"</span>"}
    if(anim&&anim.cap&&s===anim.cs)h+='<span class="p gh '+(anim.cc==="w"?"pw":"pb")+'">'+GL[anim.cap]+"</span>";
    if(kg&&p&&p.type==="k"&&p.color===G.turn()){const mt=G.in_checkmate();d.className+=" chk"+(mt?" dead":"");h+='<i class="ck"></i>'+(mt?'<b class="zz">💤</b>':"")}
    if(bdg[s])h+='<b class="bd" style="background:'+CL[bdg[s].cls][1]+'">'+CL[bdg[s].cls][0]+"</b>";d.innerHTML=h;
    d.onclick=()=>tap(s);B.appendChild(d)}
  A.innerHTML="";
  if(sug){const[x1,y1]=xy(sug.from),[x2,y2]=xy(sug.to),a=Math.atan2(y2-y1,x2-x1),sx=x2-Math.cos(a)*.3,sy=y2-Math.sin(a)*.3,h=.32;
    A.innerHTML='<line x1="'+x1+'" y1="'+y1+'" x2="'+sx+'" y2="'+sy+'" stroke="var(--ok)" stroke-width=".16" stroke-linecap="round" opacity=".9"/><polygon fill="var(--ok)" opacity=".9" points="'+x2+","+y2+" "+(sx-Math.sin(a)*h*.6)+","+(sy+Math.cos(a)*h*.6)+" "+(sx+Math.sin(a)*h*.6)+","+(sy-Math.cos(a)*h*.6)+'"/>'}
  anim=null;status()}
function status(){
  let t,m=G.turn()===me;
  if(G.in_checkmate())t=m?"Skakmat. Lawan menang.":"Skakmat! Kamu menang!";
  else if(G.game_over())t="Permainan seri.";
  else t=(m?"Giliran kamu":"Giliran lawan")+(G.in_check()?" (skak"+ckTxt()+"!)":"");
  const sub=G.game_over()?"":m?(info||(sk?"Ketuk “Saran langkah” untuk petunjuk.":"Giliranmu. Ketuk bidak lalu kotak tujuan.")):(R?(window.FBstate==="off"?"Koneksi terputus, menyambung ulang…":"Menunggu langkah teman… (kamu "+(me==="w"?"Putih":"Hitam")+")"):ai?"Lawan (AI) sedang berpikir…":"Ketuk langkah yang dimainkan lawan.");
  endUI();names();capt();const on=openName();$("st").innerHTML=t+"<small>"+sub+(on?" · "+on:"")+"</small>"}
function tap(s){ac();
  if(G.game_over()||((ai||R)&&G.turn()!==me))return;
  if(sel){const m=G.moves({square:sel,verbose:true}).find(x=>x.to===s);if(m&&m.promotion){askPromo(m.from,m.to);return}
    if(m){mvDone(G.move({from:m.from,to:m.to,promotion:"q"}));last={from:m.from,to:m.to};sel=null;sug=null;info="";render();next();return}}
  const p=G.get(s);sel=p&&p.color===G.turn()?s:null;render()}
function ev(){let s=0;const b=X.board();
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){const p=b[r][c];if(!p)continue;let v=V[p.type];
    const cb=4-Math.max(Math.abs(c-3.5),Math.abs(r-3.5));
    if(p.type==="n"||p.type==="b")v+=cb*6-((p.color==="w"?r===7:r===0)?12:0);
    if(p.type==="k"&&(p.color==="w"?r===7:r===0)&&(c<=2||c>=6))v+=25;
    if(p.type==="p")v+=cb*3+(p.color==="w"?6-r:r-1)*6;
    s+=p.color==="w"?v:-v}
  return s}
const sc=m=>(m.captured?V[m.captured]*10-V[m.piece]:0)+(m.promotion?800:0);
function sr(d,a,b){if(++nn%200===0&&Date.now()>dl)throw 0;
  if(X.in_checkmate())return-99999-d;
  if(X.game_over())return 0;
  if(d===0)return qs(a,b);
  for(const m of X.moves({verbose:true}).sort((x,y)=>sc(y)-sc(x))){
    X.move(m);const v=-sr(d-1,-b,-a);X.undo();

<script>
window.FB={join(name){return new Promise((resolve,reject)=>{
  if(!window.mqtt){reject(new Error("mqtt"));return}
  const pid=Math.random().toString(36).slice(2,10),base="catur-mabar-x7/"+name+"/",topic=base+pid,
    urls=["wss://broker.hivemq.com:8884/mqtt","wss://test.mosquitto.org:8081"];
  let i=0,hb=0;
  const next=()=>{
    if(i>=urls.length){reject(new Error("broker"));return}
    let ok=false,fail=false,lastP=null;const cache={},hs=[];
    const c=mqtt.connect(urls[i++],{clientId:"cm_"+pid,reconnectPeriod:2000,keepalive:30,connectTimeout:6000,will:{topic,payload:"",retain:true,qos:0}});

    const bad=()=>{if(!ok&&!fail){fail=true;try{c.end(true)}catch(e){}next()}};
    c.on("error",bad);

    c.on("message",(t,m)=>{const k=t.slice(base.length),x=m.toString();
      if(!x)delete cache[k];else{try{cache[k]=JSON.parse(x)}catch(e){return}}
      hs.forEach(h=>h({peers:list()}))});
    c.on("connect",()=>{if(fail)return;
      if(!ok){ok=true;
        c.subscribe(base+"+",{qos:0},err=>{if(err){reject(err);return}
          hb=setInterval(pub,15000);
          window.FBnudge=()=>{if(!c.connected){try{c.reconnect()}catch(e){}}else pub()};

          resolve({presence(p){lastP=p;pub();return Promise.resolve()},peers:()=>list(),
            onPeers(h){hs.push(h);return()=>{const j=hs.indexOf(h);if(j>=0)hs.splice(j,1)}},
            leave(){clearInterval(hb);window.FBnudge=null;window.FBstate="on";return new Promise(r=>{hs.length=0;c.publish(topic,"",{retain:true,qos:0},()=>{c.end();r()})})}})})
      }else{Object.keys(cache).forEach(k=>delete cache[k]);window.FBstate="on";window.onFB&&window.onFB();c.subscribe(base+"+",{qos:0});pub()}});
  };next()})}};
